[project]
name = "transparent-iml"
version = "0.1.0"
description = "A Unified Interpretable Machine Learning Ecosystem featuring transparent rule-based classifiers"
readme = "README.md"
license = "MIT"
authors = [
    { name = "nunkesser", email = "robin.nunkesser@hshl.de" }
]
requires-python = ">=3.14"
dependencies = [
    "imodels>=3.0.1",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "scoredrulesets>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/Italbytz/pypi-transparent-ml"
Source = "https://github.com/Italbytz/pypi-transparent-ml"
"Bug Tracker" = "https://github.com/Italbytz/pypi-transparent-ml/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "transparent_ml"
